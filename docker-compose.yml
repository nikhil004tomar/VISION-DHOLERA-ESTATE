services:

  frontend:
    build:
      context: ./vision-dholera
      dockerfile: Dockerfile
      args:
        RESEND_API_KEY: ${RESEND_API_KEY}
    container_name: vision-dholera-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - backend

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: vision-dholera-backend

    ports:
      - "8000:8000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: vision_user
      MYSQL_PASSWORD: vision_password
      MYSQL_DATABASE: vision_dholera_estate

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    volumes:
      - ./Backend/app/uploads:/app/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: vision-dholera-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nikhil
      MYSQL_DATABASE: vision_dholera_estate
      MYSQL_USER: vision_user
      MYSQL_PASSWORD: vision_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pnikhil"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: